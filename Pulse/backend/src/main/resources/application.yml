server:
  port: 8080

spring:
  application:
    name: job-scheduler

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobscheduler}
    username: ${DB_USER:jobscheduler}
    password: ${DB_PASSWORD:jobscheduler}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: job-scheduler-workers
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer: a malformed message is logged and skipped instead of
      # failing the poll forever (a "poison pill" that would block its partition).
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # Pipelines and retries block a consumer thread for the length of the run, so the
        # default 5 min poll interval would trigger rebalances and duplicate executions.
        max.poll.interval.ms: 3600000
        spring.json.trusted.packages: com.example.scheduler.model.dto
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.example.scheduler.model.dto.JobExecutionMessage
    listener:
      # Parallel consumer threads per replica, so one long pipeline doesn't stall every other job.
      concurrency: 6
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

app:
  kafka:
    topic:
      job-execution: job-execution-topic
      job-execution-dlt: job-execution-topic-dlt
  scheduler:
    poll-interval-ms: 5000
    lock-key: scheduler:dispatch-lock
    lock-ttl-ms: 4000
  jwt:
    secret: ${JWT_SECRET:this-is-a-dev-only-secret-change-me-in-production-please-0123456789}
    expiration-ms: 86400000 # 24h
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  worker:
    # Which agent-pool topics THIS replica consumes. A dedicated "heavy" replica
    # sets WORKER_TAGS=heavy; a general one can serve several: default,heavy
    tags: ${WORKER_TAGS:default}
    # Tags whose topics are provisioned at startup (see kafka/KafkaTopicConfig).
    known-tags: ${WORKER_KNOWN_TAGS:default,heavy}
  security:
    # AES-256 key (base64, must decode to exactly 32 bytes) encrypting the
    # credentials vault. The default is DEV-ONLY so the app boots out of the box;
    # generate your own (`openssl rand -base64 32`) and set CREDENTIALS_ENCRYPTION_KEY
    # for any real deployment. Changing it makes existing credentials undecryptable.
    credentials-key: ${CREDENTIALS_ENCRYPTION_KEY:ZGV2LW9ubHktMzItYnl0ZS1hZXMta2V5LWNoYW5nZSE=}
  callback:
    # Public base URL external systems use to reach this backend when completing an
    # async (awaitCallback) stage - exposed to stages as {{callback.url}}.
    base-url: ${CALLBACK_BASE_URL:http://localhost:8080}
    sweep-interval-ms: ${CALLBACK_SWEEP_INTERVAL_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.example.scheduler: INFO
    org.apache.kafka: WARN
