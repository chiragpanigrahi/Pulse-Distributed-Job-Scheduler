version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: js-postgres
    environment:
      POSTGRES_DB: jobscheduler
      POSTGRES_USER: jobscheduler
      POSTGRES_PASSWORD: jobscheduler
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobscheduler"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: js-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.1
    container_name: js-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # INTERNAL for containers (kafka:19092), HOST for apps run from your IDE (localhost:9092)
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: js-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jobscheduler
      DB_USER: jobscheduler
      DB_PASSWORD: jobscheduler
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      JWT_SECRET: change-this-secret-in-any-real-deployment-0123456789
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      CREDENTIALS_ENCRYPTION_KEY: ZGV2LW9ubHktMzItYnl0ZS1hZXMta2V5LWNoYW5nZSE=   # base64 32 bytes - CHANGE
      # This replica serves both pools so everything works out of the box. To split them, set
      # WORKER_TAGS: default here and enable the backend-heavy service below.
      WORKER_TAGS: default,heavy
      WORKER_KNOWN_TAGS: default,heavy
      CALLBACK_BASE_URL: http://localhost:8080   # must be reachable by the systems you call
    ports:
      - "8080:8080"

  # Dedicated worker pool: only consumes jobs/stages tagged "heavy".
  # backend-heavy:
  #   build: ./backend
  #   depends_on: [postgres, redis, kafka]
  #   environment:
  #     DB_HOST: postgres
  #     DB_NAME: jobscheduler
  #     DB_USER: jobscheduler
  #     DB_PASSWORD: jobscheduler
  #     REDIS_HOST: redis
  #     KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  #     JWT_SECRET: change-this-secret-in-any-real-deployment-0123456789
  #     CREDENTIALS_ENCRYPTION_KEY: ZGV2LW9ubHktMzItYnl0ZS1hZXMta2V5LWNoYW5nZSE=
  #     WORKER_TAGS: heavy
  #     WORKER_KNOWN_TAGS: default,heavy

  # Uncomment to run two backend replicas and see the distributed lock /
  # Kafka consumer group in action:
  # backend-2:
  #   build:
  #     context: ./backend
  #   depends_on: [postgres, redis, kafka]
  #   environment:
  #     <<: *backend-env
  #   ports:
  #     - "8081:8080"

  frontend:
    build:
      context: ./frontend
    container_name: js-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE_URL: http://localhost:8080

volumes:
  postgres-data:
